# ===========================
# 熙磊个人博客系统 - 应用配置
# ===========================

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: xilei-blog

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/blog_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # Jackson序列化配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 50MB

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.xilei.blog.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# PageHelper分页配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

# JWT配置
jwt:
  secret: xilei-blog-secret-key-2024-very-long-and-secure-key-for-jwt-token-generation
  expiration: 86400000  # 24小时（毫秒）
  header: Authorization
  prefix: "Bearer "

# MinIO对象存储配置
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: blog-files

# 日志配置
logging:
  level:
    com.xilei.blog: debug
    com.xilei.blog.mapper: debug
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS

# Knife4j API文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      display-name: 博客系统API
      paths-to-match: /**

# 博客自定义配置
blog:
  name: 熙磊的个人博客
  url: http://localhost:5173
  description: 一个企业级Java博客系统
  # 文章相关
  article:
    page-size: 10
    hot-size: 10
    summary-length: 200
